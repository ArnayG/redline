  <!-- Boot screen: painted as soon as the stylesheet arrives, while the ~90 classic scripts below download and run
       (several seconds on a phone network). Self-contained styles; removed after DOMContentLoaded. -->
  <div id="cb-boot" role="status" aria-live="polite" data-scripts="144">
    <script>try{var t=JSON.parse(localStorage.getItem("forge.theme.v1")||"null");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
    <style>#cb-boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:var(--bg,#0b0b0d);color:var(--text,#ecebe6);font:600 var(--fs-sm,12.5px)/1.4 var(--font,system-ui,sans-serif);letter-spacing:.04em;transition:opacity .35s ease;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#cb-boot.is-done{opacity:0;pointer-events:none}#cb-boot .cbb{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(260px,70vw)}#cb-boot .cbb-bar{width:100%;height:4px;border-radius:var(--pill,999px);background:var(--line,#2b2c33);overflow:hidden}#cb-boot .cbb-bar i{display:block;height:100%;width:3%;background:var(--accent-grad,var(--accent,#c9a56b));border-radius:inherit;transition:width .2s ease}#cb-boot .cbb-t{color:var(--text-dim,#9b9890);font-variant-numeric:tabular-nums}#cb-boot svg{opacity:.9}#cb-boot .g{stroke:var(--accent,#c9a56b)}#cb-boot .r{stroke:var(--race,#e0412f)}#cb-boot .n{stroke:var(--text,#ecebe6);fill:var(--text,#ecebe6)}@media (prefers-reduced-motion:reduce){#cb-boot,#cb-boot .cbb-bar i{transition:none}}</style>
    <div class="cbb">
      <svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><path class="g" d="M8 44a24 24 0 0 1 40.4-17.6" fill="none" stroke="#c9a56b" stroke-width="5" stroke-linecap="round"/><path class="r" d="M51.4 30.3A24 24 0 0 1 56 44" fill="none" stroke="#e0412f" stroke-width="5" stroke-linecap="round"/><path class="n" d="M32 44l12-14" stroke="#ecebe6" stroke-width="4" stroke-linecap="round"/><circle class="n" cx="32" cy="44" r="4" fill="#ecebe6"/></svg>
      <div class="cbb-bar"><i id="cb-boot-bar"></i></div>
      <div class="cbb-t" id="cb-boot-text">Loading… 0%</div>
    </div>
    <script>
    (function () {
      var boot = document.getElementById('cb-boot'), bar = document.getElementById('cb-boot-bar'), txt = document.getElementById('cb-boot-text');
      var total = +boot.getAttribute('data-scripts') || 90, n = 0, done = false;
      function show() { if (done) return; var p = Math.min(97, Math.round(n / total * 100)); bar.style.width = Math.max(3, p) + '%'; txt.textContent = 'Loading… ' + p + '%'; }
      function onLoad(e) { var t = e && e.target; if (t && t.tagName === 'SCRIPT' && t.src) { n++; show(); } }
      document.addEventListener('load', onLoad, true);
      document.addEventListener('error', function (e) { onLoad(e); }, true);
      function finish() {
        if (done) return; done = true;
        document.removeEventListener('load', onLoad, true);
        bar.style.width = '100%'; txt.textContent = 'Loading… 100%';
        var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
        raf(function () { raf(function () { boot.className = 'is-done'; setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 400); }); });
      }
      document.addEventListener('DOMContentLoaded', finish);
      window.addEventListener('load', finish);
    })();
    </script>
