name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: find js api tools tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test suite
        run: node tests/run.js
      - name: Build the cPanel zip
        run: node tools/build-zip.js --out /tmp/redline-cpanel.zip
