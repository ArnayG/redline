name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Syntax check
        run: find js api tools tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test suite
        run: node tests/run.js
        env:
          # the full suite runs in one process and needs more than Node 20's default heap
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Build the cPanel zip
        run: node tools/build-zip.js --out /tmp/redline-cpanel.zip
