<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Redline — Race</title>
  <!-- Redirect stub (docs/UNIFY-SPEC.md): Redline is one game with one UI at index.html. This file stays so old links keep working. -->
  <meta http-equiv="refresh" content="0; url=index.html#/race">
  <link rel="stylesheet" href="css/styles.css">
  <script>
  (function () {
    var target = 'index.html#/race';
    // keep any query (e.g. ?track=forge-ring) as route params
    var q = (window.location.search || '').replace(/^\?/, '');
    if (q) target += '?' + q;
    try { window.location.replace(target); } catch (e) { window.location.href = target; }
  })();
  </script>
</head>
<body>
  <main class="noscript" style="display:grid;place-items:center;min-height:100vh;text-align:center;padding:32px">
    <div>
      <h1>Redline</h1>
      <p class="cb-hint">Race now lives inside the game. <a href="index.html#/race">Continue to Redline</a>.</p>
    </div>
  </main>
</body>
</html>
